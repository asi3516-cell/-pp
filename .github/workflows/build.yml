name: Build portable players

# Produces a single self-contained file per OS (no installation needed):
#   Windows -> hh.exe
#   macOS   -> hh-macos.zip  (contains hh.app)
#   Linux   -> hh
# Download them from the workflow run's "Artifacts" section, or from a
# GitHub Release when triggered by a tag.

on:
  push:
    branches: [master, main, hh]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: hh-windows
          - os: macos-latest
            artifact: hh-macos
          - os: ubuntu-latest
            artifact: hh-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install -r build/requirements-build.txt

      - name: Build
        run: python build/make.py

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "hh.app" ]; then
            zip -r hh-macos.zip "hh.app" hh
          else
            zip -r hh-macos.zip hh
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/hh
            dist/hh.exe
            dist/hh-macos.zip
          if-no-files-found: ignore

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an Android SDK. Calling sdkmanager
      # directly avoids the android-actions/setup-android default that tries to
      # install the removed "tools" package and fails.
      - name: Install SDK packages
        run: |
          SDKMGR="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Check vector drawables
        run: python3 build/check_vectors.py

      - name: Build APK
        env:
          TV_STORE_PASS: ${{ secrets.HH_STORE_PASS }}
          TV_KEY_PASS: ${{ secrets.HH_STORE_PASS }}
          TV_KEY_ALIAS: hhkey
        run: |
          # Restore the fixed signing key so every build shares one signature.
          # Without it Gradle falls back to a throwaway debug key and each run
          # produces a differently-signed APK, which breaks updates on-device.
          if [ -n "$TV_STORE_PASS" ]; then
            echo "${{ secrets.HH_KEYSTORE_B64 }}" | base64 -d > android/app/hh-release.jks
          fi
          cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signing
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT"/build-tools/34.0.0/apksigner verify --print-certs "$APK" \
            | grep -i "certificate SHA-256" || true

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/TV-Player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hh-apk
          path: dist/TV-Player.apk

  release:
    needs: [build, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
