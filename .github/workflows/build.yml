name: Build portable players

# Produces a single self-contained file per OS (no installation needed):
#   Windows -> hh.exe
#   macOS   -> hh-macos.zip  (contains hh.app)
#   Linux   -> hh
# Download them from the workflow run's "Artifacts" section, or from a
# GitHub Release when triggered by a tag.

on:
  push:
    branches: [master, main, hh]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: hh-windows
          - os: macos-latest
            artifact: hh-macos
          - os: ubuntu-latest
            artifact: hh-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install -r build/requirements-build.txt

      - name: Build
        run: python build/make.py

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "hh.app" ]; then
            zip -r hh-macos.zip "hh.app" hh
          else
            zip -r hh-macos.zip hh
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/hh
            dist/hh.exe
            dist/hh-macos.zip
          if-no-files-found: ignore

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: python build_apk.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hh-apk
          path: dist/hh.apk

  release:
    needs: [build, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
