name: Build portable players

# Produces a single self-contained file per OS (no installation needed):
#   Windows -> hh.exe
#   macOS   -> hh-macos.zip  (contains hh.app)
#   Linux   -> hh
# Download them from the workflow run's "Artifacts" section, or from a
# GitHub Release when triggered by a tag.

on:
  push:
    branches: [master, main, hh]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  guard:
    # Faz 0 kapisi: kirmizisa hicbir paket cikmaz.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sozdizimi (node --check)
        run: |
          node --check static/app.js
          node --check static/sw.js
          node --check static/channels-data.js

      - name: app.js ES5 kalmali (acorn --ecma5)
        run: npx --yes acorn@8 --ecma5 static/app.js > /dev/null

      - name: server.py stdlib-only (ast.parse + import denetimi)
        run: |
          python3 - <<'PY'
          import ast, sys
          src = open("server.py", encoding="utf-8").read()
          tree = ast.parse(src)
          allowed = set(sys.stdlib_module_names)
          bad = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  bad += [a.name.split(".")[0] for a in node.names if a.name.split(".")[0] not in allowed]
              elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                  root = node.module.split(".")[0]
                  if root not in allowed:
                      bad.append(root)
          if bad:
              print("stdlib disi import:", sorted(set(bad)))
              sys.exit(1)
          print("server.py stdlib-only OK")
          PY

      - name: Butunluk (VERSION + zincir checksum)
        run: python3 build/verify_integrity.py

      - name: Vektor kontrolu
        run: python3 build/check_vectors.py

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: hh-windows
          - os: macos-latest
            artifact: hh-macos
          - os: ubuntu-latest
            artifact: hh-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install -r build/requirements-build.txt

      - name: Build
        run: python build/make.py

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "hh.app" ]; then
            zip -r hh-macos.zip "hh.app" hh
          else
            zip -r hh-macos.zip hh
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/hh
            dist/hh.exe
            dist/hh-macos.zip
          if-no-files-found: ignore

  apk:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an Android SDK. Calling sdkmanager
      # directly avoids the android-actions/setup-android default that tries to
      # install the removed "tools" package and fails.
      - name: Install SDK packages
        run: |
          SDKMGR="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/TV-Player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hh-apk
          path: dist/TV-Player.apk

  release:
    needs: [build, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
