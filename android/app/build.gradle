plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.openhands.tvplayer'
    compileSdk 36

    defaultConfig {
        applicationId "com.openhands.tvplayer"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"

        // Phones and Android TV boxes are all ARM in practice, so the x86
        // LibVLC payload (110 MB of the APK) is dead weight for real users.
        // x86 splits are still produced for emulator testing but are not the
        // file we hand out.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // One APK per ABI instead of a single 200 MB fat APK. The arm64 build is
    // the one to install; the universal APK stays available for odd devices.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }

    packaging {
        jniLibs {
            // Store the .so files compressed. Modern AGP leaves native libs
            // uncompressed and page-aligned (bigger APK, no install-time
            // extraction); legacy packaging compresses them so the download is
            // far smaller and Android unpacks them on install.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        release {
            // A fixed release key so the APK installs on every phone and an
            // update can replace an older build. The debug key is regenerated
            // per machine, which is what made "App not installed" appear when
            // a build from another machine was sideloaded.
            storeFile file('hh-release.jks')
            storePassword 'hhrelease2026'
            keyAlias 'hhkey'
            keyPassword 'hhrelease2026'
            // v1 is needed by older boxes that ignore the v2/v3 scheme.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            // Shrinking matters here: the unshrunk APK carried ~16 MB of unused
            // dex, which made install/startup on a real phone feel stuck.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    lint { abortOnError false }
}

// Keep the bundled web player in sync with the single source of truth.
tasks.register('syncAssets', Copy) {
    delete 'src/main/assets'
    from '../../static'
    into 'src/main/assets'
    doLast {
        copy {
            from '../../data/channels.json'
            into 'src/main/assets'
        }
    }
}
tasks.named('preBuild') { dependsOn 'syncAssets' }

dependencies {
    // LibVLC is the single playback engine. It is far more tolerant of the
    // broken/odd HLS feeds Turkish broadcasters serve than ExoPlayer was, and
    // it handles live HLS, radio and reconnects out of the box.
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.guava:guava:32.1.3-android'

    // Kotlin + AndroidX UI (bottom navigation, fragments, Room favourites).
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    ksp 'androidx.room:room-compiler:2.7.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation files('libs/nanohttpd-2.3.1.jar')
}
