plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.openhands.tvplayer'
    compileSdk 36

    defaultConfig {
        applicationId "com.openhands.tvplayer"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            // Shrinking matters here: the unshrunk APK carried ~16 MB of unused
            // dex, which made install/startup on a real phone feel stuck.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    lint { abortOnError false }
}

// Keep the bundled web player in sync with the single source of truth.
tasks.register('syncAssets', Copy) {
    delete 'src/main/assets'
    from '../../static'
    into 'src/main/assets'
    doLast {
        copy {
            from '../../data/channels.json'
            into 'src/main/assets'
        }
    }
}
tasks.named('preBuild') { dependsOn 'syncAssets' }

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.11.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.guava:guava:32.1.3-android'

    // Kotlin + AndroidX UI (bottom navigation, fragments, Room favourites).
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    ksp 'androidx.room:room-compiler:2.7.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation files('libs/nanohttpd-2.3.1.jar')
}
