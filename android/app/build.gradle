plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.openhands.tvplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.openhands.tvplayer"
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Release signing key is never committed with its password. Pass it at
    // build time instead, e.g.:
    //   TV_STORE_PASS=... TV_KEY_PASS=... ./gradlew :app:assembleRelease
    // Without the env vars the debug key is used, so a local build still works.
    signingConfigs {
        release {
            def ks = file('hh-release.jks')
            if (ks.exists() && System.getenv('TV_STORE_PASS')) {
                storeFile ks
                storePassword System.getenv('TV_STORE_PASS')
                keyAlias System.getenv('TV_KEY_ALIAS') ?: 'hhkey'
                keyPassword System.getenv('TV_KEY_PASS') ?: System.getenv('TV_STORE_PASS')
            }
        }
    }

    buildTypes {
        release {
            // R8/minify is intentionally OFF. Turning it on shipped an APK
            // that installed but crashed on launch on Android 14 (R8 stripped
            // something the UI needs at runtime); keep the known-good
            // unshrunk build. The proguard file stays for a future, verified
            // attempt.
            minifyEnabled false
            shrinkResources false
            def hasReleaseKey = file('hh-release.jks').exists() && System.getenv('TV_STORE_PASS')
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    lint { abortOnError false }
}

// Keep the bundled web player in sync with the single source of truth.
tasks.register('syncAssets', Copy) {
    delete 'src/main/assets'
    from '../../static'
    into 'src/main/assets'
    doLast {
        copy {
            from '../../data/channels.json'
            into 'src/main/assets'
        }
    }
}
tasks.named('preBuild') { dependsOn 'syncAssets' }

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.guava:guava:32.1.3-android'

    // Kotlin + AndroidX UI (bottom navigation, fragments, Room favourites).
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation files('libs/nanohttpd-2.3.1.jar')
}
